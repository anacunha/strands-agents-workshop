<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShopFast{% endblock %} - Suporte</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="container">
        <nav>
            <ul>
                <li><strong>ShopFast</strong> <small>Suporte</small></li>
            </ul>
            <ul>
                <li><a href="/">Dashboard</a></li>
                <li><a href="/orders">Pedidos</a></li>
                <li><a href="/customers">Clientes</a></li>
                <li><a href="/chat">Chat de Suporte</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container">
        <small>ShopFast Suporte &copy; 2026</small>
    </footer>
</body>
</html>
